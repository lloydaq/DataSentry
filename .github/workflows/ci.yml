name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-optional.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest

      - name: Check Python syntax
        run: python -m compileall -q app tests scripts

      - name: Check JavaScript syntax
        run: |
          node --check frontend/app.js
          node --check frontend/theme.js

      - name: Run frontend unit tests
        run: node --test "tests/frontend/*.test.mjs"

      - name: Run browser smoke test
        run: node tests/e2e/smoke.mjs

      # The steps above run without optional extras, proving they are never required.
      - name: Install optional extras
        run: python -m pip install -r requirements-optional.txt

      - name: Run tests with the optional extras
        run: python -m pytest tests/test_cleanlab.py
