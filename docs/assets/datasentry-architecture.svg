<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 740" width="1200" height="740" role="img" aria-labelledby="title desc">
  <title id="title">DataSentry architecture</title>
  <desc id="desc">A browser frontend sends multipart uploads over localhost to a FastAPI application, and a command-line gate calls the same code without a server. Both reach pure-Python services: loader, profiler, target, leakage, findings, analysis, splits, diff, contract, datasheet, modeling, label review, experiments, corrections and report, built on pandas, NumPy, scikit-learn and Pydantic, with Cleanlab as an optional extra. Responses are JSON results, JSON or HTML reports, corrected CSV copies with audit records, datasheet drafts and data contracts. There is no database and no external network call, and uploads are never written to disk.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#000000"/>
      <stop offset="1" stop-color="#141414"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 10 5 0 10z" fill="#8cb9cc"/>
    </marker>
    <style>
      .sans { font-family: Inter, -apple-system, 'SF Pro Text', 'Segoe UI', system-ui, Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, 'Cascadia Code', 'SF Mono', Consolas, monospace; }
      .panel { fill: #1a1a1a; stroke: #2b2b2b; stroke-width: 1.5; }
      .panel-accent { fill: #1a1a1a; stroke: #00638e; stroke-width: 1.5; }
      .chip { fill: #1f1f1f; stroke: #3d3d3d; stroke-width: 1; }
      .label { fill: #8cb9cc; font-size: 13px; font-weight: 700; letter-spacing: 0.12em; }
      .head { fill: #ffffff; font-size: 21px; font-weight: 700; }
      .file { fill: #e6e8ea; font-size: 15px; }
      .chiptext { fill: #e6e8ea; font-size: 14px; }
      .desc { fill: #a8acb1; font-size: 14px; }
      .flow { stroke: #8cb9cc; stroke-width: 2.5; fill: none; }
    </style>
  </defs>
  <rect width="1200" height="740" rx="22" fill="url(#bg)"/>
  <text x="48" y="58" class="sans" fill="#ffffff" font-size="24" font-weight="750">Architecture</text>
  <text x="48" y="86" class="sans desc">One local process: FastAPI serves the API and the static frontend. No database, no external network calls.</text>

  <!-- Browser -->
  <rect x="48" y="116" width="262" height="400" rx="14" class="panel"/>
  <text x="70" y="148" class="sans label">BROWSER</text>
  <text x="70" y="178" class="sans head">Frontend</text>
  <text x="70" y="212" class="mono file">index.html · style.css</text>
  <text x="70" y="238" class="mono file">app.js · theme.js</text>
  <text x="70" y="284" class="sans desc">Plain HTML/CSS/JS, no build.</text>
  <text x="70" y="306" class="sans desc">Dataset text rendered via</text>
  <text x="70" y="328" class="sans desc">textContent only. Strict CSP.</text>
  <text x="70" y="364" class="sans desc">Review decisions stay in the</text>
  <text x="70" y="386" class="sans desc">tab and travel in reports.</text>
  <text x="70" y="422" class="sans desc">Light / Dark / System themes</text>

  <!-- FastAPI -->
  <rect x="356" y="116" width="290" height="320" rx="14" class="panel-accent"/>
  <text x="378" y="148" class="sans label">FASTAPI</text>
  <text x="378" y="178" class="sans head">Application</text>
  <text x="378" y="212" class="mono file">main.py</text>
  <text x="378" y="234" class="sans desc">security headers, CSP, error</text>
  <text x="378" y="254" class="sans desc">handlers, static files</text>
  <text x="378" y="288" class="mono file">api/routes.py</text>
  <text x="378" y="310" class="sans desc">analyze, report, datasheet,</text>
  <text x="378" y="330" class="sans desc">label-review, model-impact,</text>
  <text x="378" y="350" class="sans desc">split-advice, dataset-diff,</text>
  <text x="378" y="370" class="sans desc">train-test-overlap, contract,</text>
  <text x="378" y="390" class="sans desc">corrections/apply</text>
  <text x="378" y="420" class="mono file" font-size="14">api/uploads.py · in-memory</text>

  <!-- CLI -->
  <rect x="356" y="452" width="290" height="64" rx="14" class="panel"/>
  <text x="378" y="478" class="sans label">COMMAND LINE</text>
  <text x="378" y="502" class="mono file" font-size="14">cli.py · same code, no server</text>

  <!-- Services -->
  <rect x="692" y="116" width="460" height="400" rx="14" class="panel"/>
  <text x="714" y="148" class="sans label">APP/SERVICES · NO WEB IMPORTS</text>
  <text x="714" y="178" class="sans head">Diagnostics engine</text>
  <g class="mono chiptext">
    <rect x="714" y="196" width="134" height="38" rx="8" class="chip"/><text x="728" y="221">loader</text>
    <rect x="858" y="196" width="134" height="38" rx="8" class="chip"/><text x="872" y="221">profiler</text>
    <rect x="1002" y="196" width="128" height="38" rx="8" class="chip"/><text x="1016" y="221">target</text>
    <rect x="714" y="242" width="134" height="38" rx="8" class="chip"/><text x="728" y="267">leakage</text>
    <rect x="858" y="242" width="134" height="38" rx="8" class="chip"/><text x="872" y="267">findings</text>
    <rect x="1002" y="242" width="128" height="38" rx="8" class="chip"/><text x="1016" y="267">analysis</text>
    <rect x="714" y="288" width="134" height="38" rx="8" class="chip"/><text x="728" y="313">splits</text>
    <rect x="858" y="288" width="134" height="38" rx="8" class="chip"/><text x="872" y="313">diff</text>
    <rect x="1002" y="288" width="128" height="38" rx="8" class="chip"/><text x="1016" y="313">contract</text>
    <rect x="714" y="334" width="134" height="38" rx="8" class="chip"/><text x="728" y="359">datasheet</text>
    <rect x="858" y="334" width="134" height="38" rx="8" class="chip"/><text x="872" y="359">modeling</text>
    <rect x="1002" y="334" width="128" height="38" rx="8" class="chip"/><text x="1016" y="359">label_review</text>
    <rect x="714" y="380" width="134" height="38" rx="8" class="chip"/><text x="728" y="405">experiments</text>
    <rect x="858" y="380" width="134" height="38" rx="8" class="chip"/><text x="872" y="405">corrections</text>
    <rect x="1002" y="380" width="128" height="38" rx="8" class="chip"/><text x="1016" y="405">report</text>
  </g>
  <text x="714" y="450" class="sans desc">Typed contracts: <tspan class="mono" fill="#e6e8ea">models/schemas.py</tspan> (Pydantic)</text>
  <text x="714" y="474" class="sans desc">Built on pandas · NumPy · scikit-learn</text>
  <text x="714" y="498" class="sans desc">Optional extra: Cleanlab (label review)</text>

  <!-- Flows -->
  <path d="M312 262h40" class="flow" marker-end="url(#arrow)"/>
  <text x="314" y="248" class="sans desc" font-size="12">HTTP</text>
  <path d="M648 262h40" class="flow" marker-end="url(#arrow)"/>
  <path d="M648 484h40" class="flow" marker-end="url(#arrow)"/>

  <!-- Outputs -->
  <path d="M922 518v40" class="flow" marker-end="url(#arrow)"/>
  <rect x="48" y="566" width="1104" height="100" rx="14" class="panel"/>
  <text x="70" y="598" class="sans label">RESPONSES · RETURNED TO THE CALLER, NOTHING STORED ON THE SERVER</text>
  <text x="70" y="634" class="sans file">AnalysisResult JSON</text>
  <text x="340" y="634" class="sans file">JSON and HTML reports</text>
  <text x="610" y="634" class="sans file">Corrected CSV + audit record</text>
  <text x="890" y="634" class="sans file">Datasheet draft · contract</text>
  <text x="70" y="656" class="sans desc">strict JSON, deterministic ordering</text>
  <text x="340" y="656" class="sans desc">escaped HTML, review log</text>
  <text x="610" y="656" class="sans desc">only after explicit approval</text>
  <text x="890" y="656" class="sans desc">drafts for a person to finish</text>
  <text x="48" y="702" class="sans desc">Uploads are parsed in memory and never written to disk. Errors are fixed templates: no tracebacks, no cell values.</text>
</svg>
