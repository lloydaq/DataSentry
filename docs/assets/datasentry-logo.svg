<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 96" width="420" height="96" role="img" aria-labelledby="title desc">
  <title id="title">DataSentry</title>
  <desc id="desc">DataSentry logo: a lens inspecting rows of data on an azure gradient tile, beside the DataSentry wordmark.</desc>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#000000"/>
      <stop offset="0.38" stop-color="#004a6b"/>
      <stop offset="0.68" stop-color="#00638e"/>
      <stop offset="1" stop-color="#8cb9cc"/>
    </linearGradient>
  </defs>
  <g transform="translate(8 8)">
    <rect width="80" height="80" rx="19" fill="url(#tile)"/>
    <path d="M19 26h42M19 38h42M19 50h24" stroke="#ffffff" stroke-opacity="0.4" stroke-width="3.8" stroke-linecap="round"/>
    <circle cx="38" cy="38" r="15.5" fill="none" stroke="#ffffff" stroke-width="5.2"/>
    <path d="M49.4 49.4 59.5 59.5" stroke="#ffffff" stroke-width="5.6" stroke-linecap="round"/>
  </g>
  <text x="110" y="56" font-family="Inter, -apple-system, 'SF Pro Display', 'Segoe UI', system-ui, Helvetica, Arial, sans-serif" font-size="40" font-weight="650" letter-spacing="-0.6" fill="#141414">DataSentry</text>
  <text x="112" y="80" font-family="Inter, -apple-system, 'SF Pro Text', 'Segoe UI', system-ui, Helvetica, Arial, sans-serif" font-size="15" fill="#5e646b">dataset diagnostics</text>
